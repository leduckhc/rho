# rho sprint workflow, sprint 3
#
# Sprint 1 is workflow.yaml. Sprint 2 is workflow-sprint-2.yaml. Neither is edited
# again; each is the record of its sprint.
#
# Sprint 3 has one goal: the terminal interface becomes the best one in this class,
# and it stays the fastest. Beauty is judged by critics who did not build it, and
# speed is judged by a measurement.
#
# Legend
#   role:      the subagent persona that does the work
#   reviewer:  the subagent persona that must approve the artifacts
#   artifacts: files that must exist and be non-trivial
#   dod:       machine-checkable or explicitly verifiable conditions
#   gate:      commands the controller runs; all must exit 0

version: 1
project: rho
sprint: 3
goal: >
  A terminal interface that a critic ranks at or above pi, codex, claude code, and
  jcode, in a Rust binary that starts faster and holds less memory than any of them.
  Every feature in this sprint is judged twice: once by a critic for beauty, and
  once by a benchmark for cost.

why_this_scope: >
  A harness is used through its interface. rho has a correct minimal interface, and a
  correct minimal interface loses to a beautiful one every time. The owner named the
  bar: pi, codex, claude code, and jcode. The owner also named the trap: a beautiful
  interface that costs frames, memory, or start-up time is not a win, because speed
  and memory are the reason rho exists.

principles:
  - Beauty is a feature, and it is judged by somebody who did not build it.
  - Speed is a feature, and it is judged by a number with the command that produced it.
  - State is a pure function of events. A render is tested with a test backend.
  - Input never blocks on model work, and a frame never waits on a tool.
  - Every animation has an off switch, and it stops when the terminal is not a terminal.
  - An artifact is named by a timestamp and a slug. See docs/ids.md.

conventions:
  test_command: cargo test --workspace --all-features
  lint_command: cargo clippy --workspace --all-targets --all-features -- -D warnings
  fmt_command: cargo fmt --all --check
  minimal_build_command: cargo build -p rho-cli --no-default-features --features minimal
  prose_command: python3 bench/check-prose.py $(find docs -name '*.md')
  id_command: python3 bench/check-ids.py
  stub_check: "grep -rn 'todo!\\|unimplemented!' crates/*/src   # must find nothing"
  commit_style: conventional-commits
  no_network_in_tests: true

roles:
  scout:      { model: haiku,  subagent_type: scout,     purpose: Read prior art and report compressed findings. }
  designer:   { model: sonnet, subagent_type: designer,  purpose: Design the layout, the palette, and the motion. }
  architect:  { model: opus,   subagent_type: architect, purpose: Write the spec with verbatim Rust signatures. }
  tester:     { model: opus,   subagent_type: qa,        purpose: Write failing tests from the spec before any code. }
  developer:  { model: opus,   subagent_type: developer, purpose: Make the failing tests pass. No untested behaviour. }
  reviewer:   { model: opus,   subagent_type: reviewer,  purpose: Reject any artifact that misses its DoD. Never rubber-stamp. }
  secops:     { model: opus,   subagent_type: secops,    purpose: Audit paste, attachment, and plugin trust. }
  devops:     { model: opus,   subagent_type: devops,    purpose: Frame, memory, and start-up measurement in CI. }

# ---------------------------------------------------------------------------
# The critic panel. This sprint does not end until every critic agrees.
# ---------------------------------------------------------------------------
critics:
  rule: >
    A critic never wrote the code it judges. A critic scores the interface against a
    named competitor, on evidence it gathered itself, and it returns a verdict of
    `top-peak` or `not-yet` with the exact reason. The stage ends only when every
    critic returns `top-peak` in the same round.
  panel:
    - id: beauty
      role: designer
      judges: >
        Layout, rhythm, colour, contrast, typography for a monospace grid, the header,
        the motion, and the empty state. It compares against pi, codex, claude code,
        and jcode by name, and it says which one wins each category.
    - id: usability
      role: reviewer
      judges: >
        Discoverability of a slash command, of a keyboard shortcut, and of the guide.
        Whether a first-time user reaches a first answer without reading the docs.
        Whether a wrong key is recoverable.
    - id: performance
      role: devops
      judges: >
        Time to first frame, frame time under a streaming turn, resident memory, and
        binary size. It compares against the recorded numbers in docs/benchmarks.md,
        and it fails the round on a regression it can measure.
    - id: accessibility
      role: reviewer
      judges: >
        Contrast against WCAG, behaviour with no colour, behaviour at 80 columns and
        at 40 columns, behaviour with a screen reader profile, and motion with the
        animation switched off.
  rounds:
    max: 5
    on_not_yet: >
      The controller turns every finding into a task, dispatches a developer, and runs
      the panel again. A finding with no fix must be recorded as a known limit with a
      reason, and the critic must accept the record.

# ---------------------------------------------------------------------------
# Monitoring policy. Three of eight dispatches in sprint 2 hit a turn limit.
# ---------------------------------------------------------------------------
monitoring:
  heartbeat_seconds: 90
  rules:
    - A brief with more than about four items will not finish. Split it.
    - State that everything needed is already on disk. No web research unless the brief says so.
    - A subagent must never run a git command that writes.
    - A subagent must never restore a file with `git checkout`. Copy it to /tmp first.
    - Gate a stage on its own crate while a sibling stage is mid-flight.
    - A report is a claim. The controller re-runs every gate and reads the diff.
  max_reruns_per_task: 3
  ledger: .rho-work/progress.md

# ---------------------------------------------------------------------------
# Stages
# ---------------------------------------------------------------------------
stages:

  - id: U0
    name: Prior art, read and compressed
    role: scout
    reviewer: designer
    artifacts:
      - docs/tui-prior-art.md
    dod:
      - Covers pi, codex, claude code, and jcode, and names the source read for each.
      - States, per tool: the header, the transcript shape, the tool row, the composer, the status line, and the motion.
      - States how each tool renders a large paste, an attachment, a slash command list, and a help screen.
      - States how each tool reports a duration for a session, a turn, a tool call, and thinking.
      - Names the three best ideas to take, and the three to refuse, each with a reason.
      - Every claim names its source. A claim with no source is deleted.
    gate:
      - test -s docs/tui-prior-art.md
      - python3 bench/check-prose.py docs/tui-prior-art.md

  - id: U1
    name: Design the interface
    role: designer
    reviewer: reviewer
    depends_on: [U0]
    artifacts:
      - docs/tui-design.md
      - docs/design/tui-frames/*.txt
    dod:
      - Holds a full-width frame mock, in text, for: idle, streaming, a tool run, an approval prompt, an error, and the empty state.
      - Holds a frame mock at 80 columns and at 40 columns. Nothing is unreadable at either width.
      - States the palette by role, not by taste, and states the fallback with no colour and with 16 colours.
      - States the header, and states why it is worth its rows.
      - States the motion: what moves, how fast, and what stops it.
      - Contrast for every text-on-background pair meets WCAG AA, with the measured ratio.
    gate:
      - test -s docs/tui-design.md
      - python3 bench/check-prose.py docs/tui-design.md

  - id: U2
    name: Spec the interface
    role: architect
    reviewer: reviewer
    depends_on: [U1]
    artifacts:
      - docs/specs/*-SPEC-tui-experience.md
      - docs/specs/*-SPEC-tui-plugins.md
    dod:
      - Public Rust API verbatim, for the state, the reducer, the theme, the timing, and the plugin surface.
      - Every feature the owner named has a section: paste collapsing, motion, durations, concise mode, attachments, shortcuts and help, the guide, slash commands, the header, and plugins.
      - Names every test with the single assertion it proves.
      - States the cost budget per feature: frame time, allocation per frame, and bytes held.
      - Plugin surface states its trust boundary. A plugin may not read the transcript unless the user allows it.
      - Every spec has an `## Out of scope` section.
    gate:
      - python3 bench/check-ids.py
      - python3 bench/check-prose.py $(find docs -name '*.md')

  - id: U3
    name: Red tests for the interface
    role: tester
    reviewer: reviewer
    depends_on: [U2]
    artifacts:
      - crates/rho-tui/tests/*.rs
    dod:
      - A test exists for every test the spec names, with the spec's assertion.
      - Paste: a large paste collapses to one line, the full text still reaches the model, and the composer height stays bounded.
      - Durations: a session, a turn, a tool call, and a thinking block each report an elapsed time, driven by an injected clock, never by `sleep`.
      - Concise mode: a collapsed tool call and a collapsed thinking block expand on demand, and the default is stated.
      - Motion: a frame under animation is a pure function of a tick count, so a test asserts a frame without a timer.
      - Attachments: an image paste becomes a bounded reference, and an oversize attachment is refused with a message.
      - Slash commands: the list filters, the unknown command reports, and a command never runs a tool by surprise.
      - Help and guide: the key list matches the real bindings, proven by a test that reads the binding table.
      - Every test compiles, and fails for an unimplemented body.
    gate:
      - cargo test -p rho-tui --no-run
      - "! cargo test -p rho-tui --quiet"

  - id: U4
    name: Green, in four slices
    role: developer
    reviewer: [reviewer, secops]
    depends_on: [U3]
    slices:
      - Paste, attachments, and the composer.
      - Durations, concise mode, and the tool rows.
      - The header, the theme, and the motion.
      - Slash commands, shortcuts, help, and the guide.
    dod:
      - Every U3 test passes, and no test file changed.
      - No `todo!()` and no `unimplemented!()` in `crates/rho-tui/src`.
      - A frame renders with no allocation in the steady state, or the spec records why it cannot.
      - Motion stops when the output is not a terminal, and when the user turns it off.
      - The paste path never writes an attachment outside the session root.
      - A plugin cannot read the transcript without an explicit allow.
    gate:
      - cargo test -p rho-tui -p rho-cli --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo build -p rho-cli --no-default-features --features minimal

  - id: U5
    name: Measure the cost of beauty
    role: devops
    reviewer: reviewer
    depends_on: [U4]
    artifacts:
      - bench/tui_frame.py
      - docs/benchmarks.md
    dod:
      - Time to first frame is measured on a real pseudo-terminal, before and after this sprint.
      - Frame time under a streaming turn is measured at the 50th and the 99th percentile.
      - Resident memory for an idle session and a streaming session is measured.
      - Binary size is measured for the default and the minimal feature sets.
      - Every number states its command and its machine.
      - A regression against the sprint-2 numbers fails this stage.
    gate:
      - bash -n bench/footprint.sh
      - python3 bench/check-prose.py docs/benchmarks.md

  - id: U6
    name: Drive it for real, on a real terminal
    role: controller
    reviewer: reviewer
    depends_on: [U4]
    artifacts:
      - docs/verification/*-tui.md
    dod:
      - A real run against a real provider, on a real pseudo-terminal, with a screenshot or a captured frame.
      - A paste of 500 lines, an image attachment, a slash command, the help screen, and the guide are each exercised.
      - The failure paths ran: a denied approval, a tool error, a cancelled turn, and the same thing twice.
      - A 40-column terminal and an 80-column terminal each ran a turn.
      - Every defect is filed, and fixed or recorded as known.
    gate:
      - test -s docs/verification

  - id: U7
    name: The critic panel, until every critic agrees
    role: controller
    reviewer: [designer, reviewer, devops]
    depends_on: [U5, U6]
    artifacts:
      - docs/verification/*-tui-critics.md
    dod:
      - Every critic in the panel returned `top-peak` in the same round.
      - Each round records: the critic, the verdict, the findings, and the fix for each finding.
      - A finding accepted as a known limit names the reason, and the critic accepted the record.
      - No round was skipped, and no verdict was written by the developer who wrote the code.
    gate:
      - test -s docs/verification

  - id: U8
    name: Documentation and the guide
    role: documenter
    reviewer: reviewer
    depends_on: [U7]
    artifacts:
      - README.md
      - docs/features.md
      - docs/tui-guide.md
    dod:
      - The guide teaches a first run in under one page, and it matches the real keys.
      - docs/features.md marks every feature this sprint shipped, with the owning crate.
      - Every spec matches the code that shipped.
      - Every claim on the page is proven by a test or a benchmark. An unproven claim is deleted.
    gate:
      - python3 bench/check-prose.py $(find docs -name '*.md')
      - python3 bench/check-ids.py

# ---------------------------------------------------------------------------
# Review gate. Applies to every stage.
# ---------------------------------------------------------------------------
review_gate:
  passes:
    - name: self-check
      by: role
      requires: The owning role states each DoD item as met or not met.
    - name: independent-review
      by: reviewer
      requires: >
        The reviewer runs the gate commands, reads the artifacts, and returns findings
        with severity blocker, major, or minor. It must answer one question in writing:
        which public items and which rendered states have no test?
    - name: controller-verify
      by: controller
      requires: >
        The controller re-runs every gate, reads the diff, greps for a stub, and runs
        the thing on a real terminal. A report is a claim, not a result.
  fail_action: Re-run the owning role with the findings as the brief, up to three times.
  escalate_after: 3

definition_of_done_sprint:
  - A large paste collapses to one line, and the full text still reaches the model.
  - An image attachment pastes, and an oversize one is refused with a message.
  - A working state animates, and the motion stops when it should.
  - A session, a turn, a tool call, and a thinking block each report an elapsed time.
  - Concise mode collapses a tool call and a thinking block, and it is opt-in.
  - A slash command list, a shortcut list, and a guide are all reachable from the interface.
  - The header is worth its rows, and a critic says so.
  - A third party extends the interface through a stated plugin surface.
  - Time to first frame, frame time, memory, and binary size are measured and recorded.
  - Every critic on the panel returned `top-peak` in one round.
  - fmt, clippy, the full test suite, the minimal build, the prose check, and the id check all pass.

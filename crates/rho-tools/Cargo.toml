[package]
name = "rho-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Built-in filesystem and shell tools for the rho harness."

[dependencies]
async-trait = "0.1.92"
globset = "0.4.20"
ignore = "0.4.33"
rho-core = { version = "0.1.0", path = "../rho-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "fs", "process", "io-util", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }

[package]
name = "rho-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The rho command line binary."

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
rho-acp = { version = "0.1.0", path = "../rho-acp", optional = true }
rho-config = { version = "0.1.0", path = "../rho-config" }
rho-core = { version = "0.1.0", path = "../rho-core" }
rho-instructions = { version = "0.1.0", path = "../rho-instructions" }
rho-jsonl = { version = "0.1.0", path = "../rho-jsonl", optional = true }
rho-mcp = { version = "0.1.0", path = "../rho-mcp" }
rho-plugin = { version = "0.1.0", path = "../rho-plugin", optional = true }
rho-provider-azure = { version = "0.1.0", path = "../rho-provider-azure", optional = true }
rho-provider-bedrock = { version = "0.1.0", path = "../rho-provider-bedrock", optional = true }
rho-provider-openrouter = { version = "0.1.0", path = "../rho-provider-openrouter", optional = true }
rho-skills = { version = "0.1.0", path = "../rho-skills" }
rho-tools = { version = "0.1.0", path = "../rho-tools" }
rho-tui = { version = "0.1.0", path = "../rho-tui", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[features]
default = ["tui", "jsonl", "openrouter", "bedrock", "azure", "plugins"]

# Frontends
tui = ["dep:rho-tui"]
acp = ["dep:rho-acp"]
jsonl = ["dep:rho-jsonl"]

# Providers
openrouter = ["dep:rho-provider-openrouter"]
bedrock = ["dep:rho-provider-bedrock"]
azure = ["dep:rho-provider-azure"]

# Extensibility
plugins = ["dep:rho-plugin"]

# Smallest useful build: headless, one provider, no plugins. It keeps `jsonl`,
# because a headless build with no headless frontend can only answer one prompt.
minimal = ["jsonl", "openrouter"]

[[bin]]
name = "rho"
path = "src/main.rs"

# Every example drives a real provider, and a provider is optional. Without these
# lines `cargo test --no-run` on a profile that omits the provider still compiles
# the example, and the build fails on a missing crate rather than skipping it.
# Gate command five found this, on its first run against another branch.
[[example]]
name = "steer_subagent"
required-features = ["bedrock"]

[[example]]
name = "idle_session"
required-features = ["openrouter"]

[[example]]
name = "live_sessions"
required-features = ["openrouter"]

[[example]]
name = "many_sessions"
required-features = ["openrouter"]

[dev-dependencies]
futures = "0.3.34"
tempfile = "3.27.0"

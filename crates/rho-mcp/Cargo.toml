[package]
name = "rho-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

description = "Model Context Protocol client for rho, with a shared server pool."

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
rho-core = { version = "0.1.0", path = "../rho-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "io-util", "sync", "time", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }

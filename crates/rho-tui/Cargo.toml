[package]
name = "rho-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Minimal terminal user interface for rho."

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
rho-core = { version = "0.1.0", path = "../rho-core" }
rho-redact = { version = "0.1.0", path = "../rho-redact" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1.44"
unicode-width = "0.2.2"

[dev-dependencies]
async-trait = "0.1.92"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }

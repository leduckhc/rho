# rho sprint workflow
#
# This file drives the agent workflow for sprint 1.
# Each stage lists its owner role, the artifacts it must produce, and the
# definition of done (DoD). A stage is complete only when every DoD item is
# true and the review gate passes.
#
# Legend
#   role:      the subagent persona that does the work
#   reviewer:  the subagent persona that must approve the artifacts
#   artifacts: files that must exist and be non-trivial
#   dod:       machine-checkable or explicitly verifiable conditions
#   gate:      commands the controller runs; all must exit 0

version: 1
project: rho
domain: getrho.dev
repo: ~/Work/Vibe/rho
sprint: 1
goal: >
  A composable Rust agent harness. Sprint 1 ships an initialised repo, a
  cargo workspace of small crates, internal feature docs, a website, three
  working providers (OpenRouter, AWS Bedrock, Azure OpenAI) with streaming
  and tool calling, a harness tool layer, and a minimal TUI.

principles:
  - Speed and memory are features. Measure before claiming a win.
  - TDD is mandatory. A failing test lands before production logic.
  - SOLID. Every crate has one reason to change.
  - Composable. No crate depends on a frontend. Providers are swappable.
  - Prose is ASD-STE100. Active voice. One instruction per sentence.

conventions:
  test_command: cargo test --workspace --all-features
  lint_command: cargo clippy --workspace --all-targets --all-features -- -D warnings
  fmt_command: cargo fmt --all --check
  build_command: cargo build --workspace --all-features
  doc_command: cargo doc --workspace --no-deps
  commit_style: conventional-commits
  no_network_in_tests: true      # provider tests use wiremock or recorded fixtures

roles:
  scout:
    model: haiku
    subagent_type: scout
    purpose: Locate code and report compressed context.
  documenter:
    model: sonnet
    subagent_type: docs
    purpose: Write feature docs, crate docs, and the website copy.
  architect:
    model: opus
    subagent_type: architect
    purpose: Write specs, ADRs, and per-feature implementation plans.
  tester:
    model: opus
    subagent_type: qa
    purpose: Write failing tests from the spec before any implementation.
  developer:
    model: opus
    subagent_type: developer
    purpose: Make the failing tests pass. No new behaviour without a test.
  reviewer:
    model: opus
    subagent_type: reviewer
    purpose: Reject any artifact that misses its DoD. Never rubber-stamp.
  secops:
    model: opus
    subagent_type: secops
    purpose: Audit credential handling, command execution, and plugin trust.
  designer:
    model: sonnet
    subagent_type: designer
    purpose: Design the website and the TUI layout.
  devops:
    model: opus
    subagent_type: devops
    purpose: CI, release builds, size and memory benchmarks.

# ---------------------------------------------------------------------------
# Monitoring policy. Subagents stall. The controller babysits them.
# ---------------------------------------------------------------------------
monitoring:
  heartbeat_seconds: 90
  stall_signals:
    - No tool call for two consecutive heartbeats.
    - Repeated identical tool call three times.
    - Agent reports it cannot find a file that the controller knows exists.
    - Agent asks a question instead of acting.
  actions:
    on_stall: steer_subagent with the exact missing fact or file path.
    on_second_stall: kill and re-run with a narrower brief and explicit paths.
    on_third_stall: controller does the task inline and records the reason.
  max_reruns_per_task: 3
  ledger: .rho-work/progress.md

# ---------------------------------------------------------------------------
# Stages
# ---------------------------------------------------------------------------
stages:

  - id: S0
    name: Repo and workspace bootstrap
    role: controller
    reviewer: reviewer
    artifacts:
      - Cargo.toml                       # workspace root, resolver 3, edition 2024
      - crates/rho-core/Cargo.toml
      - crates/rho-config/Cargo.toml
      - crates/rho-tools/Cargo.toml
      - crates/rho-plugin/Cargo.toml
      - crates/rho-provider-openrouter/Cargo.toml
      - crates/rho-provider-bedrock/Cargo.toml
      - crates/rho-provider-azure/Cargo.toml
      - crates/rho-tui/Cargo.toml
      - crates/rho-acp/Cargo.toml
      - crates/rho-cli/Cargo.toml
      - rust-toolchain.toml
      - rustfmt.toml
      - LICENSE
      - .gitignore
      - .github/workflows/ci.yml
      - workflow.yaml
    dod:
      - Every crate was created with `cargo new`, not by hand.
      - Workspace members inherit version, edition, and licence metadata.
      - Frontends and providers are optional cargo features on rho-cli.
      - No crate in crates/ depends on rho-tui, rho-acp, or rho-cli.
      - Release profile sets lto, codegen-units 1, strip, panic abort.
      - Git repository exists on branch main with one commit.
    gate:
      - cargo build --workspace --all-features
      - cargo fmt --all --check

  - id: S1
    name: Feature catalogue and product docs
    role: documenter
    reviewer: reviewer
    depends_on: [S0]
    artifacts:
      - docs/index.md                    # doc map
      - docs/features.md                 # full feature list, each with status and owner crate
      - docs/architecture.md             # crate graph, data flow, session lifecycle
      - docs/comparison.md               # what we take from pi, jcode, agentsdk.build, and why
      - docs/non-goals.md
    dod:
      - Every feature has an ID (F-nn), a one-line outcome, a status, and an owning crate.
      - Every feature states how a third party replaces or extends it.
      - Feature list covers: providers, tools, hooks, plugins, sessions, context, TUI, ACP, config, telemetry, memory footprint.
      - Prose passes ASD-STE100 review: active voice, sentences of 20 words or fewer.
      - No feature claims a benchmark number that no test produces.
    gate:
      - test -s docs/features.md
      - grep -qE 'F-0?1' docs/features.md

  - id: S2
    name: Core architecture spec and ADRs
    role: architect
    reviewer: reviewer
    depends_on: [S1]
    artifacts:
      - docs/specs/SPEC-01-core-runtime.md
      - docs/specs/SPEC-02-provider-interface.md
      - docs/specs/SPEC-03-tool-interface.md
      - docs/specs/SPEC-04-hooks-and-plugins.md
      - docs/specs/SPEC-05-tui.md
      - docs/adr/ADR-001-plugin-mechanism.md
      - docs/adr/ADR-002-async-runtime-and-footprint.md
      - docs/adr/ADR-003-streaming-event-model.md
    dod:
      - Each spec defines public Rust types and trait signatures verbatim.
      - Each spec lists the test cases that prove it, by name.
      - Provider spec normalises OpenRouter, Bedrock Converse, and Azure Responses onto one event stream.
      - Provider spec pins the Azure Entra audience as https://cognitiveservices.azure.com/.
      - Tool spec defines approval and sandbox boundaries, not only signatures.
      - Plugin ADR chooses in-tree traits plus stdio JSON-RPC subprocesses, and records why not WASM in sprint 1.
      - Every spec has an explicit "out of scope for sprint 1" section.
    gate:
      - test -s docs/specs/SPEC-01-core-runtime.md
      - test -s docs/adr/ADR-001-plugin-mechanism.md

  - id: S3
    name: Core runtime, red tests
    role: tester
    reviewer: reviewer
    depends_on: [S2]
    artifacts:
      - crates/rho-core/tests/*.rs
      - crates/rho-core/src/lib.rs        # types and traits only, bodies may be todo!()
    dod:
      - Tests exist for message model, event stream, agent loop turn, tool dispatch, hook order, and cancellation.
      - Tests compile.
      - Tests fail for the right reason (unimplemented), not because they do not compile.
      - No test reaches the network.
    gate:
      - cargo test -p rho-core --no-run
      - "! cargo test -p rho-core --quiet"   # must be red

  - id: S4
    name: Core runtime, green
    role: developer
    reviewer: reviewer
    depends_on: [S3]
    artifacts:
      - crates/rho-core/src/**
    dod:
      - All S3 tests pass with no test edited to fit the implementation.
      - Public API matches SPEC-01 exactly.
      - No panics on the happy path. Errors are typed with thiserror.
      - Cancellation drops in-flight work without leaking a task.
      - rho-core has no HTTP dependency.
    gate:
      - cargo test -p rho-core --all-features
      - cargo clippy -p rho-core --all-targets -- -D warnings

  - id: S5
    name: Provider layer, red tests
    role: tester
    reviewer: reviewer
    depends_on: [S4]
    parallel_group: providers-red
    artifacts:
      - crates/rho-provider-openrouter/tests/*.rs
      - crates/rho-provider-bedrock/tests/*.rs
      - crates/rho-provider-azure/tests/*.rs
      - crates/rho-core/tests/provider_contract.rs
    dod:
      - A shared contract test suite runs against every provider through a fake transport.
      - OpenRouter tests cover SSE deltas, tool_calls assembly across chunks, usage, and mid-stream error.
      - Azure tests cover the /responses event names, reasoning items, function_call items, and Entra audience.
      - Bedrock tests cover ConverseStream event kinds, toolUse assembly, and stopReason mapping.
      - Every provider test uses wiremock or a recorded fixture. No live calls.
    gate:
      - cargo test --workspace --no-run

  - id: S6
    name: Provider layer, green
    role: developer
    reviewer: [reviewer, secops]
    depends_on: [S5]
    artifacts:
      - crates/rho-provider-openrouter/src/**
      - crates/rho-provider-bedrock/src/**
      - crates/rho-provider-azure/src/**
    dod:
      - All three providers pass the shared contract suite.
      - Streaming yields the first token without buffering the whole response.
      - Tool calls are emitted as structured events, not raw text.
      - Bedrock signs with SigV4 from the standard credential chain.
      - Azure supports API key and Entra token, audience https://cognitiveservices.azure.com/.
      - No secret is ever logged, including at trace level.
      - Retry covers 429 and 5xx with jitter, and never retries a 4xx client error.
    gate:
      - cargo test --workspace --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  - id: S7
    name: Tool layer and harness tool calling
    role: [tester, developer]
    reviewer: [reviewer, secops]
    depends_on: [S4]
    artifacts:
      - crates/rho-tools/tests/*.rs
      - crates/rho-tools/src/**
      - crates/rho-plugin/tests/*.rs
      - crates/rho-plugin/src/**
    dod:
      - Tools ship: read, write, edit, list, glob, grep, bash.
      - Every tool has a JSON schema and a round-trip test.
      - Paths are resolved and confined to the session root by default.
      - bash enforces a timeout and streams output.
      - Plugin host launches a subprocess, handshakes, lists tools, and calls one.
      - A crashed plugin does not take down the session.
      - Tool results feed back into a provider turn end to end, proven by a test.
    gate:
      - cargo test -p rho-tools -p rho-plugin --all-features

  - id: S8
    name: Minimal TUI
    role: [designer, tester, developer]
    reviewer: reviewer
    depends_on: [S4, S6, S7]
    artifacts:
      - docs/specs/SPEC-05-tui.md
      - crates/rho-tui/tests/*.rs
      - crates/rho-tui/src/**
      - crates/rho-cli/src/**
    dod:
      - TUI renders: transcript, streaming answer, thinking, tool rows, input, status line.
      - State is a pure function of events. Render is tested with a test backend, not a real terminal.
      - Input never blocks on model work.
      - Ctrl-C cancels the turn. A second Ctrl-C exits.
      - "`rho --help`, `rho run <prompt>`, and `rho` interactive all work."
      - Time to first frame is measured and recorded.
    gate:
      - cargo test -p rho-tui -p rho-cli --all-features
      - cargo run -q -p rho-cli -- --help

  - id: S9
    name: End-to-end verification against real providers
    role: qa
    reviewer: reviewer
    depends_on: [S6, S7, S8]
    artifacts:
      - docs/verification/sprint-1.md
      - .rho-work/e2e-results.md
    dod:
      - A live smoke test ran against OpenRouter, Bedrock, and Azure, or the reason it could not is recorded.
      - Each run shows a streamed answer and at least one tool call and tool result.
      - Resident memory per session is measured and recorded.
      - Time to first frame and time to first token are measured and recorded.
      - Every defect found is filed and either fixed or recorded as known.
    gate:
      - test -s docs/verification/sprint-1.md

  - id: S10
    name: Website
    role: [designer, documenter]
    reviewer: reviewer
    depends_on: [S1]
    artifacts:
      - web/**
      - web/src/pages/index.astro
      - web/README.md
    dod:
      - Static site builds with no runtime JavaScript framework on the critical path.
      - Home page states what rho is in one sentence, then the composable crate story.
      - Every number on the site links to the test or benchmark that produced it.
      - Install command, docs link, and GitHub link are present.
      - Site builds in CI. Lighthouse-style basics: contrast passes, no layout shift on load.
    gate:
      - cd web && npm ci && npm run build

  - id: S11
    name: CI, size, and footprint benchmarks
    role: devops
    reviewer: reviewer
    depends_on: [S8]
    artifacts:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - bench/footprint.sh
      - docs/benchmarks.md
    dod:
      - CI runs fmt, clippy, test, and build on Linux and macOS.
      - CI builds the minimal feature set and the all-features set.
      - footprint.sh reports release binary size and resident memory per session.
      - docs/benchmarks.md records real measured numbers with the command used.
    gate:
      - bash -n bench/footprint.sh

# ---------------------------------------------------------------------------
# Review gate. Applies to every stage.
# ---------------------------------------------------------------------------
review_gate:
  passes:
    - name: self-check
      by: role
      requires: The owning role re-reads its own DoD and states each item as met or not met.
    - name: independent-review
      by: reviewer
      requires: >
        The reviewer reads the artifacts, runs the gate commands, and returns
        findings with severity blocker, major, or minor. A blocker or major
        finding fails the stage.
    - name: controller-verify
      by: controller
      requires: >
        The controller runs the gate commands itself and inspects the diff.
        The controller never trusts a subagent report alone.
  fail_action: Re-run the owning role with the findings as the brief. Repeat up to three times.
  escalate_after: 3

# ---------------------------------------------------------------------------
# Release policy. The repository is private until the first release.
# ---------------------------------------------------------------------------
release_policy:
  visibility_now: private
  visibility_at_release: public
  checklist: docs/release-checklist.md
  rules:
    - Do not publish the website before the repository is public.
    - Do not announce the project before the repository is public.
    - Scan the tracked files and the whole history for a secret before you go public.
  go_public_command: >
    gh repo edit leduckhc/rho --visibility public
    --accept-visibility-change-consequences

definition_of_done_sprint:
  - Repository exists at ~/Work/Vibe/rho and on GitHub, MIT licensed.
  - Repository visibility is private. docs/release-checklist.md states how to go public.
  - Cargo workspace of small crates builds, with frontends and providers as features.
  - docs/features.md lists every intended feature with status and owning crate.
  - Website builds and explains rho.
  - OpenRouter, Bedrock, and Azure providers stream answers and tool calls.
  - The harness executes tool calls and returns results to the model.
  - A minimal TUI runs a real conversation.
  - cargo fmt, cargo clippy -D warnings, and cargo test all pass.
  - Measured memory per session and time to first frame are recorded in docs/benchmarks.md.

# rho sprint workflow, sprint 2
#
# Sprint 1 lives in workflow.yaml. Do not edit that file; it is the record of a
# finished sprint. This file drives sprint 2.
#
# The legend, the roles, the monitoring policy, and the review gate are the same
# as sprint 1. This file repeats them, because a stage brief must be readable
# alone.
#
# Legend
#   role:      the subagent persona that does the work
#   reviewer:  the subagent persona that must approve the artifacts
#   artifacts: files that must exist and be non-trivial
#   dod:       machine-checkable or explicitly verifiable conditions
#   gate:      commands the controller runs; all must exit 0

version: 1
project: rho
domain: getrho.dev
repo: ~/Work/Vibe/rho
sprint: 2
goal: >
  Make rho a drop-in ACP backend for makit. Sprint 2 ships layered config with
  credential resolution, an append-only session log with resume and branching,
  and a conforming ACP frontend. It proves the memory claim that started the
  project: one ACP session must cost far less than a Node harness session.

why_this_scope: >
  The project exists because a Node ACP server costs more than 100 MB per
  session, and makit must hold 50 concurrent sessions. Sprint 1 proved the
  agent loop, the providers, and the tools. Nothing of that reaches makit until
  rho speaks ACP. Config and sessions come first, because ACP `session/load`
  and `session/resume` need a session format, and every provider needs a
  credential source that is not an environment variable.

principles:
  - Speed and memory are features. Measure before claiming a win.
  - TDD is mandatory. A failing test lands before production logic.
  - SOLID. Every crate has one reason to change.
  - Composable. No crate depends on a frontend. Providers are swappable.
  - Prose is ASD-STE100. Active voice. One instruction per sentence.
  - A green suite proves only what the tests assert. Break the code and watch the test fail.

conventions:
  test_command: cargo test --workspace --all-features
  lint_command: cargo clippy --workspace --all-targets --all-features -- -D warnings
  fmt_command: cargo fmt --all --check
  minimal_build_command: cargo build -p rho-cli --no-default-features --features minimal
  prose_command: python3 bench/check-prose.py $(find docs -name '*.md')
  stub_check: "grep -rn 'todo!\\|unimplemented!' crates/*/src   # must find nothing"
  commit_style: conventional-commits
  no_network_in_tests: true

roles:
  scout:      { model: haiku,  subagent_type: scout,     purpose: Locate code and report compressed context. }
  documenter: { model: sonnet, subagent_type: docs,      purpose: Write feature docs, crate docs, and website copy. }
  architect:  { model: opus,   subagent_type: architect, purpose: Write specs and ADRs with verbatim Rust signatures. }
  tester:     { model: opus,   subagent_type: qa,        purpose: Write failing tests from the spec before any implementation. }
  developer:  { model: opus,   subagent_type: developer, purpose: Make the failing tests pass. No untested behaviour. }
  reviewer:   { model: opus,   subagent_type: reviewer,  purpose: Reject any artifact that misses its DoD. Never rubber-stamp. }
  secops:     { model: opus,   subagent_type: secops,    purpose: Audit credentials, command execution, and peer trust. }
  devops:     { model: opus,   subagent_type: devops,    purpose: CI, release builds, size and memory benchmarks. }

# ---------------------------------------------------------------------------
# Monitoring policy. Subagents stall. The controller babysits them.
# Sprint 1 measured a stall or a turn limit in 6 of 16 dispatches.
# ---------------------------------------------------------------------------
monitoring:
  heartbeat_seconds: 90
  stall_signals:
    - No tool call for two consecutive heartbeats.
    - Repeated identical tool call three times.
    - Agent reports it cannot find a file that the controller knows exists.
    - Agent asks a question instead of acting.
  actions:
    on_stall: steer_subagent with the exact missing fact or file path.
    on_second_stall: kill and re-run with a narrower brief and explicit paths.
    on_third_stall: controller does the task inline and records the reason.
  rules:
    - Split a stage so it fits the turn budget. Verification gets its own dispatch.
    - State in every brief that all needed material is already on disk. No web research.
    - A subagent must never run a git command that writes. See D-015.
    - A subagent must never run `git checkout` to undo a deliberate break. See D-029.
    - Gate a stage on its own crates while a sibling stage is mid-flight.
  max_reruns_per_task: 3
  ledger: .rho-work/progress.md

# ---------------------------------------------------------------------------
# Stages
# ---------------------------------------------------------------------------
stages:

  - id: T0
    name: Reality audit, and doc reconciliation
    role: controller
    reviewer: reviewer
    artifacts:
      - docs/features.md
      - .rho-work/progress.md
    dod:
      - Every feature row states the status that the code proves, not the status that was planned.
      - A feature that shipped after sprint 1 reads `sprint-1.5` or `sprint-2`, and names its real owning crate.
      - Every crate that exists appears in docs/features.md or docs/architecture.md.
      - Every crate with an empty `lib.rs` is listed here as sprint-2 work.
      - The prose check reports zero violations.
    gate:
      - python3 bench/check-prose.py $(find docs -name '*.md')
      - "grep -c 'sprint-2' docs/features.md"

  - id: T1
    name: Spec config and sessions
    role: architect
    reviewer: reviewer
    depends_on: [T0]
    artifacts:
      - docs/specs/SPEC-13-config.md
      - docs/specs/SPEC-14-sessions.md
      - docs/adr/ADR-004-session-file-format.md
    dod:
      - Each spec states the public Rust types and trait signatures verbatim.
      - Each spec names every test that proves it, with the assertion of each test.
      - SPEC-13 defines the merge order: defaults, global file, project file, profile, environment, flags.
      - SPEC-13 defines credential resolution, including a shell command source, and states that no source is logged.
      - SPEC-13 states what a malformed config file does. It must fail closed, never fall back to a permissive default.
      - SPEC-14 defines the JSONL record set, and the parent pointer that makes branching possible.
      - SPEC-14 states the resume rule for a truncated last line, because a crash can cut a line in half.
      - SPEC-14 states that a session file never holds a credential, and how a tool argument gets redacted.
      - ADR-004 says why JSONL with a parent pointer, and what it rules out.
      - Each spec has an `## Out of scope` section.
    gate:
      - test -s docs/specs/SPEC-13-config.md
      - test -s docs/specs/SPEC-14-sessions.md
      - python3 bench/check-prose.py $(find docs -name '*.md')

  - id: T1b
    name: Fix the T1 findings, and spec the approval model
    role: architect
    reviewer: reviewer
    depends_on: [T1]
    artifacts:
      - docs/specs/SPEC-13-config.md
      - docs/specs/SPEC-14-sessions.md
      - docs/specs/SPEC-15-message-queue-and-steering.md
      - docs/specs/SPEC-16-approval-and-permission.md
    dod:
      - Every blocker and every major from the T1 review is fixed, and each fix names its test.
      - No spec depends on a function that does not exist, unless the spec names the stage that builds it.
      - The session header records the approval mode and the sandbox mode. A resume refuses to widen either one.
      - Every reader path has a byte cap. A hostile line cannot exhaust memory.
      - The pairing rule covers the cancel path, the crash path, and the truncated-tail path.
      - SPEC-16 states the resolution table, and every row of it resolves to a stated policy.
      - SPEC-16 fails closed: a timeout, a closed channel, and a client with no permission capability are each a denial.
      - SPEC-16 respects `BothPolicies` from SPEC-11. A child never becomes more permissive than its parent.
      - Every public item the reviewer listed as untested now has a named test.
    gate:
      - test -s docs/specs/SPEC-16-approval-and-permission.md
      - python3 bench/check-prose.py $(find docs -name '*.md')

  - id: T2
    name: Config layer, red tests
    role: tester
    reviewer: reviewer
    depends_on: [T1b]
    artifacts:
      - crates/rho-config/tests/*.rs
      - crates/rho-config/src/lib.rs      # types only, bodies may be todo!()
    dod:
      - Tests cover the merge order, an environment override, a profile, a missing file, and a malformed file.
      - Tests cover credential resolution from an environment variable, a file value, and a shell command.
      - One test asserts that a resolved credential never appears in a formatted or logged value.
      - Tests use `tempfile`. No test reads the real `~/.config/rho` or `~/.rho`.
      - Tests compile, and fail on an unimplemented body, not on a type error.
    gate:
      - cargo test -p rho-config --no-run
      - "! cargo test -p rho-config --quiet"

  - id: T3
    name: Config layer, green
    role: developer
    reviewer: [reviewer, secops]
    depends_on: [T2]
    artifacts:
      - crates/rho-config/src/**
    dod:
      - Every T2 test passes, and no test was edited to fit the implementation.
      - The public API matches SPEC-13 exactly.
      - A malformed file returns a typed error. It never falls back to a default that grants more access.
      - Credential values use the redaction type from `rho-redact`. There is one redaction home.
      - "`rho-config` keeps no HTTP dependency and no terminal dependency."
    gate:
      - cargo test -p rho-config --all-features
      - cargo clippy -p rho-config --all-targets -- -D warnings
      - "grep -rn 'todo!\\|unimplemented!' crates/rho-config/src"   # must find nothing

  - id: T4
    name: Session log, red tests
    role: tester
    reviewer: reviewer
    depends_on: [T1b]
    artifacts:
      - crates/rho-core/tests/session_log.rs
    dod:
      - Tests cover append, resume, branch, and ephemeral mode.
      - One test truncates the last line of a file and asserts that resume recovers the earlier records.
      - One test asserts that the file is append-only. A resume must not rewrite an earlier byte.
      - One test asserts that a branch keeps the original records, and links the new records to a parent.
      - One test asserts that no credential and no redacted argument reaches the file.
      - Tests use `tempfile` and no sleep.
    gate:
      - cargo test -p rho-core --no-run

  - id: T5
    name: Session log, green
    role: developer
    reviewer: [reviewer, secops]
    depends_on: [T4]
    artifacts:
      - crates/rho-core/src/session/**
    dod:
      - Every T4 test passes, with no test edited.
      - The record set matches SPEC-14 exactly.
      - A write failure degrades the session to ephemeral mode with a warning. It never ends the run.
      - Resume rebuilds the message list in the order the file records it.
      - The append path costs one write per record. It never rewrites the file.
    gate:
      - cargo test -p rho-core --all-features
      - cargo clippy -p rho-core --all-targets --all-features -- -D warnings

  - id: T12
    name: Ask approval policy and the message queue, red tests
    role: tester
    reviewer: reviewer
    depends_on: [T1b, T5]
    artifacts:
      - crates/rho-core/tests/approval_ask.rs
      - crates/rho-core/tests/message_queue.rs
    dod:
      - Tests cover every row of the SPEC-16 resolution table.
      - Tests cover each fail-closed rule: a timeout, a closed channel, and a peer that cannot be asked.
      - One test proves a child policy is never more permissive than its parent.
      - Tests cover the bounded queue: order, a full queue, delivery at a turn boundary, and a cancel that keeps the queue.
      - No test uses `sleep`. A test synchronises with a channel, a `Notify`, or `tokio::time` pause.
    gate:
      - cargo test -p rho-core --no-run

  - id: T13
    name: Ask approval policy and the message queue, green
    role: developer
    reviewer: [reviewer, secops]
    depends_on: [T12]
    artifacts:
      - crates/rho-core/src/**
      - crates/rho-tui/src/**
      - crates/rho-cli/src/**
    dod:
      - Every T12 test passes, with no test edited.
      - The Ask policy implements the existing `ApprovalPolicy` trait, and no existing caller changed.
      - The TUI prompt never blocks the input editor and never blocks the event stream.
      - Ctrl-C during a prompt denies the call, and it does not exit.
      - A denial reaches the model as a tool error. It never ends the run.
      - "`rho run` with no terminal resolves to read-only, proven by a test."
      - F-29, F-32, F-33, and F-34 in docs/features.md state what the code now does.
    gate:
      - cargo test -p rho-core -p rho-tui -p rho-cli --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  - id: T6
    name: ACP frontend, red tests
    role: tester
    reviewer: reviewer
    depends_on: [T5, T13]
    artifacts:
      - crates/rho-acp/tests/*.rs
    dod:
      - Tests drive the agent over a pipe pair, one JSON message per line, exactly as a client does.
      - Tests cover initialize, session/new, session/prompt, session/cancel, and session/load.
      - One test asserts the stop reason spelling against the on-disk ACP schema. The wire word is `cancelled`.
      - One test asserts that every `tool_call` notification gets a matching `tool_call_update`.
      - One test asserts that a tool error reaches the client and does not end the session.
      - One test asserts that an unknown method returns a JSON-RPC error, and the process stays alive.
      - No test starts a real provider. The provider is a fake from `rho-provider-testkit`.
    gate:
      - cargo test -p rho-acp --no-run
      - "! cargo test -p rho-acp --quiet"

  - id: T7
    name: ACP frontend, green
    role: developer
    reviewer: [reviewer, secops]
    depends_on: [T6]
    artifacts:
      - crates/rho-acp/src/**
      - crates/rho-cli/src/**
    dod:
      - Every T6 test passes, with no test edited.
      - The mapping matches SPEC-06 for every method that sprint 2 claims.
      - "`rho acp` runs the agent on stdio. The command appears in `rho --help`."
      - One process serves many sessions. A session id keys its own `Session`.
      - A malformed line returns a JSON-RPC parse error. It never panics and never exits.
      - The permission request path reaches the client, and a denial blocks the tool call.
      - No secret appears on stdout, on stderr, or in a session update.
    gate:
      - cargo test -p rho-acp -p rho-cli --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo build -p rho-cli --no-default-features --features minimal

  - id: T8
    name: Prove the test catches the bug
    role: controller
    reviewer: reviewer
    depends_on: [T3, T5, T7, T13]
    artifacts:
      - docs/verification/sprint-2-mutations.md
    dod:
      - Each new invariant test is run against a deliberate break, and it fails.
      - The break and the restore are recorded, with the command and the real output.
      - The file was copied to /tmp first. `git checkout` was never used to restore it.
      - Any test that passes against the break is rewritten, and re-proved.
    gate:
      - test -s docs/verification/sprint-2-mutations.md

  - id: T9
    name: Drive it for real against a live client and a live model
    role: controller
    reviewer: reviewer
    depends_on: [T7]
    artifacts:
      - docs/verification/sprint-2.md
      - .rho-work/acp-e2e-results.md
    dod:
      - A real client script drove `rho acp` end to end against OpenRouter and Bedrock.
      - The run shows a streamed answer, one tool call, one tool result, and a stop reason.
      - The failure paths ran: an absent file, a denied permission, and the same thing twice.
      - A resumed session continued a real conversation from a file on disk.
      - Resident memory for one ACP session is measured, and compared with a Node harness session.
      - Fifty concurrent sessions in one process are measured, or the reason they were not is recorded.
      - Every defect is filed, and fixed or recorded as known.
    gate:
      - test -s docs/verification/sprint-2.md

  - id: T10
    name: Guards, benchmarks, and CI
    role: devops
    reviewer: reviewer
    depends_on: [T9]
    artifacts:
      - .github/workflows/ci.yml
      - bench/footprint.sh
      - docs/benchmarks.md
    dod:
      - Each sprint-2 defect has a test that pins the invariant, or a CI guard.
      - A guard was broken on purpose, and it tripped.
      - CI runs the codec tests twice: with `fast-json` on, and with `fast-json` off.
      - CI runs the minimal build, so an optional dependency cannot creep into it.
      - docs/benchmarks.md records the ACP memory number, and the command that produced it.
      - The benchmark table names the machine and the date for every number.
    gate:
      - bash -n bench/footprint.sh
      - python3 bench/check-prose.py $(find docs -name '*.md')

  - id: T11
    name: Reconcile the docs with the code
    role: documenter
    reviewer: reviewer
    depends_on: [T10]
    artifacts:
      - docs/features.md
      - docs/specs/SPEC-06-acp.md
      - docs/specs/SPEC-13-config.md
      - docs/specs/SPEC-14-sessions.md
      - README.md
      - .rho-work/DECISIONS.md
    dod:
      - Every spec matches the code that shipped. A divergence is amended, not left.
      - Every new test name appears in its spec `## Test cases` section.
      - docs/features.md marks the sprint-2 features as shipped, with the owning crate.
      - README.md states that rho speaks ACP, with the command.
      - Every claim that no test or benchmark proves is deleted.
      - Every decision from sprint 2 is in .rho-work/DECISIONS.md, with its reason and what it rules out.
    gate:
      - python3 bench/check-prose.py $(find docs -name '*.md')

# ---------------------------------------------------------------------------
# Review gate. Applies to every stage.
# ---------------------------------------------------------------------------
review_gate:
  passes:
    - name: self-check
      by: role
      requires: The owning role re-reads its own DoD, and states each item as met or not met.
    - name: independent-review
      by: reviewer
      requires: >
        The reviewer reads the artifacts, runs the gate commands, and returns findings
        with severity blocker, major, or minor. A blocker or a major finding fails the
        stage. The brief must tell the reviewer the defect history, and must ask for the
        list of public items that no test touches.
    - name: controller-verify
      by: controller
      requires: >
        The controller runs the gate commands itself, reads the diff, and greps for a
        stub. The controller never trusts a subagent report alone.
  fail_action: Re-run the owning role with the findings as the brief. Repeat up to three times.
  escalate_after: 3

# ---------------------------------------------------------------------------
# Release policy. The repository is private until the first release.
# ---------------------------------------------------------------------------
release_policy:
  visibility_now: private
  visibility_at_release: public
  checklist: docs/release-checklist.md
  rules:
    - Do not publish the website before the repository is public.
    - Do not announce the project before the repository is public.
    - Scan the tracked files and the whole history for a secret before you go public.

definition_of_done_sprint:
  - docs/features.md states the real status of every feature.
  - Layered config merges the defaults, the files, a profile, the environment, and the flags.
  - A credential resolves from an environment variable, a file, or a shell command, and never reaches a log.
  - A session appends to a JSONL file, resumes from it, and branches from an earlier turn.
  - A session closes, cancels without closing, lists, deletes, and forks.
  - A user message that arrives mid-turn is queued, and it reaches the model at the next turn boundary.
  - rho asks before a mutating tool call, wherever a human or a client can answer.
  - "`rho acp` serves a conforming ACP client, with many sessions in one process."
  - A live client drove a real model through rho over ACP, with a tool call and a tool result.
  - Memory for one ACP session is measured, and recorded against the Node number that started this project.
  - cargo fmt, cargo clippy -D warnings, cargo test, and the minimal build all pass.
  - Every sprint-2 defect has a test that fails against the defect.

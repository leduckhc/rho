findings:
  - severity: none
    note: >
      The contract held. resolve_from<R: BufRead> matches the seam name the tester added.
      Implementation: git_entry.take(GIT_ENTRY_MAX_BYTES).read_until(b'\n', ..), so the
      counting seam stays at or under 4096 bytes on the 10 MB one-line file.
  - severity: minor
    note: >
      The sanitizer collapses any run of two or more dots to one dot before use. The spec
      text 3a only says "every byte outside [A-Za-z0-9._-] is replaced" and "empty becomes
      a placeholder". A raw name like "..\\..\\windows" keeps its dots after byte-strip and
      would still hold "..", which the invariant test a_hostile_gitdir_cannot_escape_the_store
      forbids. Dot-run collapse is the minimal fix that honors the invariant "never emit ..".
      The spec could state this dot-collapse rule explicitly. It changes no test.
  - severity: minor
    note: >
      Two same-named directories are kept apart by an 8-hex digest of the full identity
      path via std::hash::DefaultHasher (fixed SipHash keys, deterministic across runs).
      No dependency added.

